[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-capstone"
version = "0.1.0"
description = "Phase-based context-aware fraud detection research project"
requires-python = ">=3.11,<3.14"
dependencies = [
    "Flask>=3.0,<4.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=18.0,<22.0",
    "scikit-learn>=1.6,<2.0",
    "pymongo>=4.8,<5.0",
    "dnspython>=2.7,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "mongomock>=4.1,<5.0"]
xgboost = ["xgboost>=2.0,<4.0"]
tensorflow = ["tensorflow>=2.18,<3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
